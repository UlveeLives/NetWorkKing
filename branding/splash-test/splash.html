<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetWorkKing — açılış ekranı (test)</title>
<style>
  :root{--bar:#0d2a1a;--neon:#16ff5a;--code:#c8f5d8;--term:#7dffa8;--pk:#bfffe0;--ink:#e2f5e9;--pcb:#8fe0b0}
  html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
  body.page[data-bg="dark"]{background:#1b2130}
  body.page[data-bg="light"]{background:#eef1f6}
  body.page[data-bg="wall"]{background:linear-gradient(135deg,#0f3d6e 0%,#3b7bbf 45%,#f0a35e 100%)}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  /* the splash: title-bar green whose edges fade away (no hard border) */
  .splash{position:relative;width:520px;padding:58px 80px 52px;display:flex;flex-direction:column;align-items:center;gap:12px;animation:in .6s cubic-bezier(.2,.9,.3,1.2) both}
  .splash::before{content:"";position:absolute;inset:0;background:var(--bar);background-image:var(--bgcode);
    -webkit-mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 76%,rgba(0,0,0,.55) 88%,transparent 100%);mask-image:radial-gradient(ellipse 50% 50% at 50% 50%,#000 76%,rgba(0,0,0,.55) 88%,transparent 100%)}
  @keyframes in{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
  .splash.out{animation:out .6s ease-in both}
  @keyframes out{to{opacity:0;transform:scale(1.04)}}
  .splash > *{position:relative}
  /* circuit-board traces drawn and wiped above the progress line (behind the logo and the name) */
  #pcb{position:absolute;left:0;top:0;pointer-events:none}
  .lg{width:200px;height:200px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .lg .frame{animation:frame 2.6s ease-in-out infinite}
  @keyframes frame{50%{stroke-opacity:.55}}
  .lg .pk path{stroke-dasharray:26 400;stroke-dashoffset:-60;stroke-width:12;opacity:0;filter:drop-shadow(0 0 6px #16ff5a);animation:pk 1.6s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i) * .2s)}
  @keyframes pk{0%{stroke-dashoffset:-60;opacity:0}12%{opacity:1}80%{opacity:1}100%{stroke-dashoffset:-104;opacity:0}}
  .lg .nd{animation:nd 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .2s + .9s)}
  @keyframes nd{0%,100%{transform:scale(1)}18%{transform:scale(1.13)}36%{transform:scale(1)}}
  .lg .cross{animation:cr 3.2s ease-in-out infinite}
  @keyframes cr{50%{stroke-opacity:.55}}
  /* the N: a neon tube — mostly lit, now and then a soft flicker */
  .lg .neon{animation:neon 4.2s linear infinite}
  @keyframes neon{0%,18%,22%,24%,61%,64%,100%{opacity:1}19%{opacity:.35}21%{opacity:.8}23%{opacity:.4}62%{opacity:.55}63%{opacity:.85}}
  .lg .core{animation:core 4.2s linear infinite}
  @keyframes core{0%,18%,24%,61%,64%,100%{stroke-opacity:.9}19%,23%{stroke-opacity:.4}62%{stroke-opacity:.5}}
  /* symbols */
  .lg [class^="a-"],.lg .r1,.lg .r2,.lg .r3,.lg .r4,.lg .sw1,.lg .sw2{transform-box:fill-box;transform-origin:center}
  .lg .a-up{animation:up 1.2s ease-in-out infinite}.lg .a-dn{animation:dn 1.2s ease-in-out infinite .6s}
  @keyframes up{0%{transform:translateY(3px);opacity:0}40%,60%{opacity:1}100%{transform:translateY(-3px);opacity:0}}
  @keyframes dn{0%{transform:translateY(-3px);opacity:0}40%,60%{opacity:1}100%{transform:translateY(3px);opacity:0}}
  .lg .r1{animation:r1 1.6s ease-in-out infinite}.lg .r2{animation:r2 1.6s ease-in-out infinite .4s}.lg .r3{animation:r3 1.6s ease-in-out infinite .8s}.lg .r4{animation:r4 1.6s ease-in-out infinite 1.2s}
  @keyframes r1{0%,40%,100%{transform:none}20%{transform:translateY(-2.5px)}}
  @keyframes r2{0%,40%,100%{transform:none}20%{transform:translateX(2.5px)}}
  @keyframes r3{0%,40%,100%{transform:none}20%{transform:translateY(2.5px)}}
  @keyframes r4{0%,40%,100%{transform:none}20%{transform:translateX(-2.5px)}}
  .lg .sw1{animation:s1 .9s linear infinite}.lg .sw2{animation:s2 .9s linear infinite}
  @keyframes s1{0%{transform:translateX(-3px);opacity:.3}50%{opacity:1}100%{transform:translateX(3px);opacity:.3}}
  @keyframes s2{0%{transform:translateX(3px);opacity:.3}50%{opacity:1}100%{transform:translateX(-3px);opacity:.3}}
  .lg .bk{animation:bk 2.4s linear infinite;animation-delay:calc(var(--b) * .3s)}

  .lg .led{animation:led .5s steps(1) infinite}.lg .l1{animation-duration:.33s}.lg .l2{animation-duration:.7s}
  @keyframes led{50%{opacity:.15}}
  .lg .w1,.lg .w2,.lg .w3{opacity:.12;animation:wf 1.8s ease-in-out infinite}.lg .w2{animation-delay:.3s}.lg .w3{animation-delay:.6s}
  @keyframes wf{0%,10%{opacity:.12}25%,70%{opacity:1}90%,100%{opacity:.12}}
  .lg .cl{stroke-dasharray:10 10;stroke-dashoffset:10;animation:cl 2.8s steps(10) infinite}
  .lg .c1{animation-delay:.6s}.lg .c2{animation-delay:1.2s}.lg .c3{animation-delay:1.8s}
  @keyframes cl{0%{stroke-dashoffset:10}25%,85%{stroke-dashoffset:0}100%{stroke-dashoffset:0;opacity:0}}
  .lg .lk{animation:led .18s steps(1) infinite}.lg .po{animation:led 1.1s steps(1) infinite}
  .name{font-size:30px;font-weight:800;letter-spacing:.3px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:2px}
  .name b{color:var(--neon)}
  .beta{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:#e2572b;border-radius:6px;padding:2px 7px}
  .bar{width:100%;height:3px;border-radius:3px;background:rgba(22,255,90,.15);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width .35s ease}
  .code{width:100%;height:118px;font:11.2px/17px "JetBrains Mono","Cascadia Mono",Consolas,monospace;color:var(--code);overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%)}

  .code .p{color:var(--neon)} .code .c{color:var(--term);opacity:.65} .code .s{color:var(--pk)} .code .ok{color:var(--neon);font-weight:700}
  .cur{display:inline-block;width:7px;height:13px;background:var(--neon);vertical-align:-2px;animation:bl .8s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .foot{display:flex;flex-direction:column;align-items:center;gap:3px;margin-top:4px;text-align:center}
  .by{font-size:11.5px;color:var(--ink);opacity:.85}
  .by b{color:var(--neon);font-weight:700}
  .cr{font-size:10.5px;color:var(--term);opacity:.6}
  .ver{font:10.5px "JetBrains Mono",Consolas,monospace;color:var(--term);opacity:.55}
  .ctl{position:fixed;left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px;z-index:5}
  .ctl button{border:1px solid #c6cfe0;background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
  .ctl button.on{background:#1d7a47;color:#fff;border-color:#1d7a47}
  body.win .ctl{display:none}
  @media (prefers-reduced-motion:reduce){.lg *{animation:none!important}}

<script>
"use strict";
// faint, still code behind everything (the "program code" style of the title bar)
(function(){ const L = ["const sw = rack.add('SW-01', {ports:48});", "for (const p of sw.ports) link(p, pp[p.n]);", "interface GigabitEthernet1/0/24", " switchport access vlan 20", "show vlan brief", "ping 10.0.20.1 -n 4"];
  let b = "", y = 12; for (let i = 0; i < 40; i++){ const s = L[i % L.length]; b += `<text x="${(i * 37) % 120 - 40}" y="${y}" fill-opacity="${(.05 + (i % 3) * .025).toFixed(3)}">${s.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</text>`; y += 15; }
  document.documentElement.style.setProperty("--bgcode", `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="600"><g fill="#c8f5d8" font-family="Consolas,monospace" font-size="10">${b}</g></svg>`)}")`); })();
/* ---------- circuit-board traces: drawn, held, wiped — each on its own clock, like "matrix" rain ----------
   Only in the part above the progress line, never over the logo or the name. */
let pcbRun = 0;
function pcb(){
  const me = ++pcbRun, sp = document.getElementById("sp"), cv = document.getElementById("pcb"), ctx = cv.getContext("2d");
  const dpr = devicePixelRatio || 1, box = sp.getBoundingClientRect(), bar = document.getElementById("barw").getBoundingClientRect();
  const W = box.width, H = bar.top - box.top - 6; cv.width = W * dpr; cv.height = H * dpr; cv.style.width = W + "px"; cv.style.height = H + "px"; ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const rel = r => ({x:r.left - box.left - 10, y:r.top - box.top - 10, w:r.width + 20, h:r.height + 20});
  const keep = [rel(sp.querySelector(".lg").getBoundingClientRect()), rel(document.getElementById("nm").getBoundingClientRect())];
  const BH = box.height, inside = (x, y) => ((x - W / 2) / (W * .5 * .74)) ** 2 + ((y - BH / 2) / (BH * .5 * .74)) ** 2 < 1;
  const free = (x, y) => inside(x, y) && y < H - 4 && !keep.some(k => x > k.x && x < k.x + k.w && y > k.y && y < k.y + k.h);
  const G = 10, traces = [];
  function make(){ for (let t = 0; t < 40; t++){
      let x = Math.round((20 + Math.random() * (W - 40)) / G) * G, y = Math.round((20 + Math.random() * (H - 30)) / G) * G; if (!free(x, y)) continue;
      const pts = [[x, y]]; let dir = Math.floor(Math.random() * 4) * 2;   // 0 → right, 2 ↓, 4 ←, 6 ↑ (odd = 45°)
      const n = 2 + Math.floor(Math.random() * 3);
      for (let i = 0; i < n; i++){ const len = (2 + Math.floor(Math.random() * 5)) * G, d = dir, dx = [1, 1, 0, -1, -1, -1, 0, 1][d], dy = [0, 1, 1, 1, 0, -1, -1, -1][d];
        const nx = x + dx * len, ny = y + dy * len; let ok = true; for (let k = 1; k <= 6; k++) if (!free(x + (nx - x) * k / 6, y + (ny - y) * k / 6)) ok = false; if (!ok) break;
        x = nx; y = ny; pts.push([x, y]); dir = (dir + (Math.random() < .5 ? 1 : 7)) % 8; }
      if (pts.length < 2) continue;
      let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
      return {pts, L, t0:performance.now() + Math.random() * 1500, draw:700 + Math.random() * 900, hold:500 + Math.random() * 1200, wipe:500 + Math.random() * 700}; }
    return null; }
  const along = (tr, d) => { const out = [tr.pts[0]]; let left = d; for (let i = 1; i < tr.pts.length; i++){ const a = tr.pts[i - 1], b = tr.pts[i], s = Math.hypot(b[0] - a[0], b[1] - a[1]);
      if (left >= s){ out.push(b); left -= s; } else { const k = left / s; out.push([a[0] + (b[0] - a[0]) * k, a[1] + (b[1] - a[1]) * k]); break; } } return out; };
