<html lang="az"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NetWorkKing — açılış ekranı (test)</title>
<style>
  :root{--bar:#0d2a1a;--neon:#16ff5a;--code:#c8f5d8;--term:#7dffa8;--pk:#bfffe0;--ink:#e2f5e9}
  html,body{margin:0;height:100%;background:transparent;font-family:"Segoe UI Variable","Segoe UI",system-ui,sans-serif;overflow:hidden;user-select:none}
  body.page[data-bg="dark"]{background:#1b2130}
  body.page[data-bg="light"]{background:#eef1f6}
  body.page[data-bg="wall"]{background:linear-gradient(135deg,#0f3d6e 0%,#3b7bbf 45%,#f0a35e 100%)}
  .stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  /* the splash itself: title-bar green, like the logo's own background */
  .splash{position:relative;width:400px;padding:28px 26px 20px;border-radius:26px;background:var(--bar);
    box-shadow:0 0 0 1px rgba(22,255,90,.22),0 24px 60px rgba(0,0,0,.45);display:flex;flex-direction:column;align-items:center;gap:12px;overflow:hidden;animation:in .55s cubic-bezier(.2,.9,.3,1.2) both}
  @keyframes in{from{opacity:0;transform:scale(.88) translateY(10px)}to{opacity:1;transform:none}}
  .splash.out{animation:out .45s ease-in both}
  @keyframes out{to{opacity:0;transform:scale(1.05)}}
  /* faint code behind everything, like the title bar */
  .splash::before{content:"";position:absolute;inset:0;opacity:.5;pointer-events:none;background-image:var(--bgcode);background-repeat:repeat}
  .lg{position:relative;width:196px;height:196px;display:block;filter:drop-shadow(0 6px 18px rgba(0,0,0,.45))}
  .lg .frame{animation:frame 2.4s ease-in-out infinite}
  @keyframes frame{50%{stroke-opacity:.55}}
  /* packets running out from the centre along every spoke, one spoke after another */
  .lg .pk path{stroke-dasharray:26 400;stroke-dashoffset:-60;stroke-width:12;opacity:0;filter:drop-shadow(0 0 6px #16ff5a);animation:pk 1.6s cubic-bezier(.45,0,.55,1) infinite;animation-delay:calc(var(--i) * .2s)}
  @keyframes pk{0%{stroke-dashoffset:-60;opacity:0}12%{opacity:1}80%{opacity:1}100%{stroke-dashoffset:-104;opacity:0}}
  /* the device a packet reaches lights up */
  .lg .nd{animation:nd 1.6s ease-in-out infinite;animation-delay:calc(var(--i) * .2s + .9s)}
  @keyframes nd{0%,100%{transform:scale(1)}18%{transform:scale(1.13)}36%{transform:scale(1)}}
  .lg .cross{animation:cr 3.2s ease-in-out infinite}
  @keyframes cr{50%{stroke-opacity:.55}}
  .lg .core{animation:core 1.6s ease-in-out infinite}
  @keyframes core{50%{stroke-width:8}}
  .name{position:relative;font-size:29px;font-weight:800;letter-spacing:.3px;color:var(--ink);display:flex;align-items:center;gap:8px;margin-top:2px}
  .name b{color:var(--neon)}
  .beta{font-size:10.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:#fff;background:#e2572b;border-radius:6px;padding:2px 7px}
  .bar{position:relative;width:100%;height:3px;border-radius:3px;background:rgba(22,255,90,.15);overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--neon);box-shadow:0 0 8px var(--neon);transition:width .25s ease}
  /* what the program is doing, as code lines */
  .code{position:relative;width:100%;height:104px;font:11.2px/17px "JetBrains Mono","Cascadia Mono",Consolas,monospace;color:var(--code);overflow:hidden;
    -webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%);mask-image:linear-gradient(to bottom,transparent 0,#000 30%,#000 100%)}
  .code .l{white-space:pre;overflow:hidden;text-overflow:ellipsis}
  .code .p{color:var(--neon)} .code .c{color:var(--term);opacity:.65} .code .s{color:var(--pk)} .code .ok{color:var(--neon);font-weight:700}
  .cur{display:inline-block;width:7px;height:13px;background:var(--neon);vertical-align:-2px;animation:bl .8s steps(1) infinite}
  @keyframes bl{50%{opacity:0}}
  .ver{position:relative;font:10.5px "JetBrains Mono",Consolas,monospace;color:var(--term);opacity:.6}
  /* test controls (hidden in the real splash window) */
  .ctl{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:6px;flex-wrap:wrap;justify-content:center;background:rgba(255,255,255,.95);padding:8px 10px;border-radius:12px;box-shadow:0 6px 20px rgba(0,0,0,.25);font-size:13px}
  .ctl button{border:1px solid #c6cfe0;background:#fff;border-radius:8px;padding:5px 10px;cursor:pointer;font:inherit}
  .ctl button.on{background:#1d7a47;color:#fff;border-color:#1d7a47}
  body.win .ctl{display:none}
  @media (prefers-reduced-motion:reduce){.lg *{animation:none!important}}
</style></head>
<body class="page" data-bg="dark">

 256L256.0 424.0"/><path style="--i:5" d="M256 256L137.2 374.8"/><path style="--i:6" d="M256 256L88.0 256.0"/><path style="--i:7" d="M256 256L137.2 137.2"/></g><circle class="core" cx="256" cy="256" r="70" fill="#050806" stroke="#16ff5a" stroke-width="5" stroke-opacity=".9"/><path class="n" d="M227 287v-62l58 62v-62" fill="none" stroke="#16ff5a" stroke-width="17" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/><g class="nd" style="--i:0;transform-origin:256.0px 88.0px"><circle cx="256.0" cy="88.0" r="46" fill="#3aa8f0" stroke="#ffffff" stroke-width="7"/><g transform="translate(218.3 50.3) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M14 33h21a7.5 7.5 0 0 0 .7-15A10 10 0 0 0 16.5 15.6 8.5 8.5 0 0 0 14 33z"/></g></g><g class="nd" style="--i:1;transform-origin:374.8px 137.2px"><circle cx="374.8" cy="137.2" r="46" fill="#2f6fe0" stroke="#ffffff" stroke-width="7"/><g transform="translate(337.1 99.5) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="24" cy="24" r="14"/><path d="M24 12v8m-3-5 3-3 3 3M24 36v-8m-3 5 3 3 3-3M12 24h8m-5-3-3 3 3 3M36 24h-8m5-3 3 3-3 3"/></g></g><g class="nd" style="--i:2;transform-origin:424.0px 256.0px"><circle cx="424.0" cy="256.0" r="46" fill="#14a37f" stroke="#ffffff" stroke-width="7"/><g transform="translate(386.3 218.3) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="14" width="32" height="20" rx="3"/><path d="M14 21h18m-4-3 4 3-4 3M34 28H16m4-3-4 3 4 3"/></g></g><g class="nd" style="--i:3;transform-origin:374.8px 374.8px"><circle cx="374.8" cy="374.8" r="46" fill="#e24b3b" stroke="#ffffff" stroke-width="7"/><g transform="translate(337.1 337.1) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="8" y="12" width="32" height="24" rx="2"/><path d="M8 20h32M8 28h32M18 12v8M30 12v8M13 20v8M24 20v8M35 20v8M18 28v8M30 28v8"/></g></g><g class="nd" style="--i:4;transform-origin:256.0px 424.0px"><circle cx="256.0" cy="424.0" r="46" fill="#6b5bd6" stroke="#ffffff" stroke-width="7"/><g transform="translate(218.3 386.3) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="11" y="9" width="26" height="9" rx="2"/><rect x="11" y="20" width="26" height="9" rx="2"/><rect x="11" y="31" width="26" height="9" rx="2"/><path d="M16 13.5h1M16 24.5h1M16 35.5h1"/></g></g><g class="nd" style="--i:5;transform-origin:137.2px 374.8px"><circle cx="137.2" cy="374.8" r="46" fill="#0fb5c9" stroke="#ffffff" stroke-width="7"/><g transform="translate(99.5 337.1) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 19a21 21 0 0 1 30 0M14 25a13 13 0 0 1 20 0M19 31a6 6 0 0 1 10 0"/><circle cx="24" cy="36" r="1.8" fill="#fff"/></g></g><g class="nd" style="--i:6;transform-origin:88.0px 256.0px"><circle cx="88.0" cy="256.0" r="46" fill="#f28c1c" stroke="#ffffff" stroke-width="7"/><g transform="translate(50.3 218.3) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="11" width="30" height="20" rx="2"/><path d="M24 31v6M17 37h14"/></g></g><g class="nd" style="--i:7;transform-origin:137.2px 137.2px"><circle cx="137.2" cy="137.2" r="46" fill="#d6409f" stroke="#ffffff" stroke-width="7"/><g transform="translate(99.5 99.5) scale(1.572)" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 12h22v17h-5v5h-4v3h-4v-3h-4v-5h-5z"/><path d="M18 17v5M22 17v5M26 17v5M30 17v5"/></g></g></svg>
  <div class="name"><span>Net<b>Work</b>King</span><span class="beta">beta</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="code" id="code"></div>
  <div class="ver">v3.8.0-beta.1</div>
</div></div>
<div class="ctl">
  <span style="align-self:center">Masaüstü:</span>
  <button data-bg="dark" class="on">Tünd</button><button data-bg="light">Açıq</button><button data-bg="wall">Divar kağızı</button>
  <button data-a="replay">↻ Yenidən oynat</button>
</div>
<script>
"use strict";
// the faint code background of the title bar ("program code" style)
(function(){ const L = ["const sw = rack.add('SW-01', {ports:48});", "for (const p of sw.ports) link(p, pp[p.n]);", "interface GigabitEthernet1/0/24", " switchport access vlan 20", "show vlan brief", "ping 10.0.20.1 -n 4"];
  let b = "", y = 12; for (let i = 0; i < 26; i++){ const s = L[i % L.length]; b += `<text x="${(i * 37) % 120 - 40}" y="${y}" fill-opacity="${(.05 + (i % 3) * .025).toFixed(3)}">${s.replace(/&/g, "&amp;").replace(/</g, "&lt;")}</text>`; y += 15; }
  document.documentElement.style.setProperty("--bgcode", `url("data:image/svg+xml,${encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="420" height="400"><g fill="#c8f5d8" font-family="Consolas,monospace" font-size="10">${b}</g></svg>`)}")`); })();
// what really happens while NetWorkKing starts (main.js / main page), shown as code
const STEPS = [
  [`<span class="p">$</span> networkking <span class="s">--beta</span> 3.8.0-beta.1`, 4],
  [`app.setAppUserModelId(<span class="s">"…networkking.beta"</span>)`, 8],
  [`win = new BrowserWindow({ frame: <span class="p">false</span>, background: <span class="s">"#0d2a1a"</span> })`, 16],
  [`win.loadFile(<span class="s">"index.html"</span>)`, 22],
  [`await loadStore()            <span class="c">// IndexedDB → layihələr</span>`, 38],
  [`await CAT.load()             <span class="c">// 530 model · 41 marka</span>`, 52],
  [`Object.assign(ICO, ART.A)    <span class="c">// 58 cihaz şəkli</span>`, 62],
  [`applyTheme(<span class="s">"dark"</span>); applyTitleBg(<span class="s">"terminal"</span>)`, 70],
  [`fxWindow().warmUp()          <span class="c">// genie effekti hazır</span>`, 80],
  [`render(APPS.building)        <span class="c">// 8 tətbiq</span>`, 92],
  [`<span class="ok">✓ hazırdır</span> <span class="c">· 1.4 s</span>`, 100]
];
let run = 0;
async function play(){
  const me = ++run, box = document.getElementById("code"), bar = document.getElementById("bar"); box.innerHTML = ""; bar.style.width = "0";
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  for (const [html, pct] of STEPS){
    if (me !== run) return;
    const line = document.createElement("div"); line.className = "l"; box.appendChild(line);
    while (box.children.length > 6) box.firstChild.remove();
    // type the visible text quickly, then swap in the coloured version
    const plain = html.replace(/<[^>]+>/g, "").replace(/&amp;/g, "&");
    for (let i = 1; i <= plain.length; i += 3){ if (me !== run) return; line.textContent = plain.slice(0, i); line.insertAdjacentHTML("beforeend", '<span class="cur"></span>'); await sleep(14); }
    line.innerHTML = html; bar.style.width = pct + "%"; await sleep(120 + Math.random() * 160);
  }
  box.lastChild && box.lastChild.insertAdjacentHTML("beforeend", ' <span class="cur"></span>');
  return true;
}
const inWin = /[?&]win=1/.test(location.search); if (inWin) document.body.className = "win";
play().then(done => { if (done && inWin) setTimeout(() => document.getElementById("sp").classList.add("out"), 700); });
document.querySelector(".ctl").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.bg){ document.body.dataset.bg = b.dataset.bg; document.querySelectorAll("[data-bg]").forEach(x => x.classList.toggle("on", x === b)); }
  if (b.dataset.a === "replay"){ const s = document.getElementById("sp"), c = s.cloneNode(true); s.replaceWith(c); play(); } });
</script>
